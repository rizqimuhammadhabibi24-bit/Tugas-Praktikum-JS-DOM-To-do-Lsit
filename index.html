<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@rizqi.hbibi24_</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="todo-card">
        <h1>To Do List</h1>

        <div class="input-group">
          <input
            type="text"
            id="inputTask"
            placeholder="Tambahkan tugas baru..."
            autocomplete="off"
          />
          <button id="btnTambah">Tambah</button>
        </div>

        <div class="stat-container">
          <div>Total: <span id="totalTask">0</span></div>
          <div>Selesai: <span id="completedTask">0</span></div>
          <div>Belum: <span id="uncompletedTask">0</span></div>
        </div>
        <ul id="listContainer"></ul>
        <p id="pesanKosong" class="empty-state">
          Belum ada tugas. Silakan tambah tugas baru!
        </p>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
